<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xpress Market</title>
    <base href="/" />

    <!-- Librerías de terceros -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Estilos de MudBlazor y Propios -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link href="XpressMarket.Client.styles.css" rel="stylesheet" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div style="position:fixed; top:0; left:0; width:100vw; height:100vh; background-color:#6b2181; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999;">
            <img src="images/expressmarket.png" alt="XpressMarket" style="width:180px; margin-bottom:20px;" />
            <div style="border: 4px solid #fbf2db; border-top: 4px solid #f38218; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite;"></div>
            <p style="color:#fbf2db; font-family:sans-serif; margin-top:15px; font-weight:500;">Cargando XpressMarket...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Carga del framework de Blazor (única referencia) -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Librerías JS ejecutas tras Blazor -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/download.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/charts.js"></script>

    <script>
            window.abrirPdfDesdeBase64 = function (base64Data, fileName) {
                const binaryString = window.atob(base64Data);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);

                window.open(blobUrl, '_blank');
            };
    </script>
</body>
</html>
